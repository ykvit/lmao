changelog:
  exclude:
    labels:
      - release
  categories:
    - title: Security
      labels:
        - security
    - title: Added
      labels:
        - enhancement
    - title: Fixed
      labels:
        - bug
    - title: Documentation
      labels:
        - documentation
    - title: Dependencies
      labels:
        - dependencies
    - title: CI and tooling
      labels:
        - ci-tools
    - title: Other changes
      labels:
        - "*"