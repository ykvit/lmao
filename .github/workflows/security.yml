name: Security

# Daily checks that do not depend on a code change: new advisories appear
# for pinned dependencies, actions and the published image.
#
# GitHub disables scheduled workflows in a public repository after 60 days
# without repository activity (Dependabot merges do not count). If that
# happens, re-enable the workflow in the Actions tab.

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/security.yml
      - ci.mk
      - scripts/ci/audit.sh
      - scripts/ci/scan-image.sh
      - scripts/ci/scan-published.sh
      - scripts/ci/zizmor-sarif.sh

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: false

env:
  CI_DEV_IMAGE: lmao:dev-ci-${{ github.sha }}

jobs:
  audit:
    name: Audit dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker
        uses: ./.github/actions/setup-docker # zizmor: ignore[self-repository]

      - name: make audit
        run: make audit

  scan-published:
    name: Scan published image
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    permissions:
      contents: read
      packages: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Trivy cache date
        id: cache-date
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Cache Trivy data
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/trivy-cache
          key: trivy-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-date.outputs.day }}
          restore-keys: |
            trivy-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: make scan-published
        env:
          TRIVY_CACHE_DIR: ${{ runner.temp }}/trivy-cache
          SARIF_FILE: reports/trivy-latest.sarif
        run: make scan-published

      - name: Upload SARIF to Code scanning
        if: ${{ !cancelled() && hashFiles('reports/trivy-latest.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: reports/trivy-latest.sarif
          category: trivy-published-image

  zizmor:
    name: Audit workflows (online)
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: make zizmor-sarif
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SARIF_FILE: reports/zizmor.sarif
        run: make zizmor-sarif

      - name: Upload SARIF to Code scanning
        if: ${{ !cancelled() && hashFiles('reports/zizmor.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: reports/zizmor.sarif
          category: zizmor