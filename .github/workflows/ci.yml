name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.14"
  IMAGE: lmao:ci-${{ github.sha }}

jobs:
  lint-workflows:
    name: Lint GitHub Workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2

      - name: zizmor
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pipx run zizmor --format=github .github/workflows/

  lint-and-test:
    name: Lint, Audit & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff format check
        run: ruff format --check .

      - name: Ruff lint
        run: ruff check --output-format=github .

      - name: Dependency audit
        run: pip-audit

      - name: Run tests with coverage
        run: pytest --cov-report=xml --cov-report=html

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/
          retention-days: 14
          if-no-files-found: ignore

  docker-build:
    name: Build, Scan & Smoke-test Image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

      - name: Validate Compose configurations
        run: |
          set -euo pipefail
          combos=(
            "compose.dev.yaml"
            "compose.prod.yaml"
            "compose.dev.yaml compose.gpu.yaml"
            "compose.prod.yaml compose.gpu.yaml"
          )
          for combo in "${combos[@]}"; do
            args=(-f compose.base.yaml)
            for f in ${combo}; do args+=(-f "${f}"); done
            echo "Validating: compose.base.yaml ${combo}"
            env UID="$(id -u)" GID="$(id -g)" docker compose "${args[@]}" config --quiet
          done

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build production image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: production
          push: false
          load: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

      - name: Start container
        run: |
          docker run --detach --name lmao-ci \
            --publish 5000:5000 \
            "${IMAGE}"

      - name: Wait for application health
        run: |
          for i in {1..30}; do
            if [ "$(docker inspect -f '{{.State.Running}}' lmao-ci)" != "true" ]; then
              echo "::error::Container exited prematurely"
              exit 1
            fi
            if curl --fail --silent http://127.0.0.1:5000/health; then
              echo "Application is healthy."
              exit 0
            fi
            echo "Waiting for application... ($i/30)"
            sleep 2
          done
          echo "::error::Application failed to become healthy"
          exit 1

      - name: Identify layer reported by Trivy
        run: |
          set -euo pipefail
          docker pull python:3.14.4-slim

          echo "=== Application image layers ==="
          docker image inspect "${IMAGE}" \
            --format '{{json .RootFS.Layers}}' | jq -r 'to_entries[] | "\(.key): \(.value)"'

          echo "=== Base image layers ==="
          docker image inspect python:3.14.4-slim \
            --format '{{json .RootFS.Layers}}' | jq -r 'to_entries[] | "\(.key): \(.value)"'

          echo "=== Vulnerability layer ==="
          echo 'sha256:0cee34d6d81cbf58855be84e325f71326b5e87b11b8139a10b1babbe9ff8ac87'
          
      - name: Verify container runs as non-root
        run: |
          USER_ID="$(docker exec lmao-ci id -u)"
          if [ "${USER_ID}" = "0" ]; then
            echo "::error::Container is running as root"
            exit 1
          fi
          echo "Container runs as UID ${USER_ID}."

      # Temporary diagnostics: generate a report without failing the job.
      # The original blocking scan remains below.
      - name: Generate Trivy diagnostic JSON
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          format: json
          output: trivy-report.json
          severity: CRITICAL,HIGH
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: os,library
          scanners: vuln

      - name: Show Trivy finding details
        run: |
          set -euo pipefail

          echo "=== Image metadata ==="
          jq '{ImageID: .Metadata.ImageID, RepoTags: .Metadata.RepoTags}' trivy-report.json

          echo "=== Relevant findings, result targets and package records ==="
          jq '
            .Results[]?
            | select(
                any(.Vulnerabilities[]?; .PkgName == "msgpack" or .PkgName == "setuptools")
                or any(.Packages[]?; .Name == "msgpack" or .Name == "setuptools")
              )
            | {
                Target,
                Class,
                Type,
                RelevantVulnerabilities: [
                  .Vulnerabilities[]?
                  | select(.PkgName == "msgpack" or .PkgName == "setuptools")
                ],
                RelevantPackages: [
                  .Packages[]?
                  | select(.Name == "msgpack" or .Name == "setuptools")
                ]
              }
          ' trivy-report.json

          echo "=== Package records visible to Python in the running container ==="
          docker exec -i lmao-ci python - <<'PY'
          from importlib import metadata

          for name in ("msgpack", "setuptools"):
              try:
                  distribution = metadata.distribution(name)
              except metadata.PackageNotFoundError:
                  print(f"{name}: not found by importlib.metadata")
              else:
                  print(f"{name}: version={distribution.version}, location={distribution.locate_file('')}")
          PY

          echo "=== Matching paths in the running container ==="
          docker exec lmao-ci sh -c \
            "find /usr/local /opt /app \( -iname '*msgpack*' -o -iname '*setuptools*' \) -print 2>/dev/null" \
            || true

      - name: Upload Trivy diagnostic report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trivy-diagnostic-report
          path: trivy-report.json
          retention-days: 7
          if-no-files-found: warn

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          scanners: vuln

      - name: Container logs
        if: always()
        run: docker logs lmao-ci 2>&1 || true

      - name: Cleanup
        if: always()
        run: docker rm -f lmao-ci || true
