[project]
name = "lmao"
version = "2.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "Flask==3.1.3",
    "Werkzeug==3.1.9",
    "python-dotenv==1.2.4",
    "requests==2.34.2",
    "gunicorn==26.2.0",
]

[dependency-groups]
dev = [
    "ruff==0.17.1",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pip-audit==2.10.1",
]

[tool.uv]
# This repository is an application; do not install it as a package.
package = false

[tool.ruff]
# Set the maximum line length to 88 (matching Black's default)
line-length = 88
# target-version is inferred from project.requires-python

[tool.ruff.lint]
# E, W - pycodestyle; F - Pyflakes; I - isort
select = ["E", "F", "W", "I"]
# The formatter handles line length
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
pythonpath = [
    ".",
]

[tool.coverage.run]
source_pkgs = ["core", "app"]
branch = true
omit = [
    "tests/*",
    "*/__init__.py",
]

[tool.coverage.report]
show_missing = true
# Ratchet: raise this to the measured TOTAL (rounded down) with every PR.
fail_under = 80
skip_covered = false
exclude_also = [
    'if __name__ == .__main__.:',
]
