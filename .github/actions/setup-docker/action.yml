name: Set up Docker
description: Set up Buildx and expose the GitHub cache runtime to make targets.

runs:
  using: composite
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Expose GitHub cache runtime
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        script: |
          for (const name of ["ACTIONS_RUNTIME_TOKEN", "ACTIONS_RESULTS_URL"]) {
            const value = process.env[name];

            if (!value) {
              throw new Error(`Missing GitHub cache variable: ${name}`);
            }

            if (name === "ACTIONS_RUNTIME_TOKEN") {
              core.setSecret(value);
            }

            core.exportVariable(name, value);
          }