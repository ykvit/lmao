name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: lmao:ci-${{ github.sha }}

jobs:
  lint-workflows:
    name: Lint GitHub Workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2

      - name: zizmor
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pipx run zizmor --format=github .github/workflows/

  lint-and-test:
    name: Lint, Audit & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Build dev image
        run: docker build --target dev --tag lmao:test .

      - name: Ruff format check
        run: docker run --rm lmao:test ruff format --check .

      - name: Ruff lint
        run: docker run --rm lmao:test ruff check --output-format=github .

      - name: Audit production dependencies
        run: |
          docker run --rm lmao:test sh -ec '
            uv export --locked --no-dev --no-emit-project --no-hashes \
              --format requirements-txt \
              --output-file /tmp/requirements-audit.txt
            pip-audit --no-deps -r /tmp/requirements-audit.txt
          '

      - name: Run tests with coverage
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --volume "${PWD}:/app" \
            --workdir /app \
            lmao:test \
            pytest --cov-report=xml --cov-report=html

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/
          retention-days: 14
          if-no-files-found: ignore

  docker-build:
    name: Build, Scan & Smoke-test Image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

      - name: Validate Compose configurations
        run: |
          set -euo pipefail
          combos=(
            "compose.dev.yaml"
            "compose.prod.yaml"
            "compose.dev.yaml compose.gpu.yaml"
            "compose.prod.yaml compose.gpu.yaml"
          )
          for combo in "${combos[@]}"; do
            args=(-f compose.base.yaml)
            for f in ${combo}; do args+=(-f "${f}"); done
            echo "Validating: compose.base.yaml ${combo}"
            env UID="$(id -u)" GID="$(id -g)" docker compose "${args[@]}" config --quiet
          done

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build production image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: production
          push: false
          load: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

      - name: Start container
        run: |
          docker run --detach --name lmao-ci \
            --publish 5000:5000 \
            "${IMAGE}"

      - name: Wait for application health
        run: |
          for i in {1..30}; do
            if [ "$(docker inspect -f '{{.State.Running}}' lmao-ci)" != "true" ]; then
              echo "::error::Container exited prematurely"
              exit 1
            fi
            if curl --fail --silent http://127.0.0.1:5000/health; then
              echo "Application is healthy."
              exit 0
            fi
            echo "Waiting for application... ($i/30)"
            sleep 2
          done
          echo "::error::Application failed to become healthy"
          exit 1

      - name: Verify container runs as non-root
        run: |
          USER_ID="$(docker exec lmao-ci id -u)"
          if [ "${USER_ID}" = "0" ]; then
            echo "::error::Container is running as root"
            exit 1
          fi
          echo "Container runs as UID ${USER_ID}."

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          scanners: vuln

      - name: Container logs
        if: always()
        run: docker logs lmao-ci 2>&1 || true

      - name: Cleanup
        if: always()
        run: docker rm -f lmao-ci || true