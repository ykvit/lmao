name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI_PLATFORM: linux/amd64
  CI_DEV_IMAGE: lmao:dev-ci-${{ github.sha }}
  CI_IMAGE: lmao:ci-${{ github.sha }}

jobs:
  lint-workflows:
    name: Lint Workflows & CI Scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Check workflows and CI scripts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make ci-workflows WORKFLOW_LINT_MODE=online

  lint-and-test:
    name: Lint, Audit & Test
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Expose GitHub cache runtime
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const names = [
              "ACTIONS_RUNTIME_TOKEN",
              "ACTIONS_RESULTS_URL",
            ];

            for (const name of names) {
              const value = process.env[name];

              if (!value) {
                throw new Error(`Missing GitHub cache variable: ${name}`);
              }

              if (name === "ACTIONS_RUNTIME_TOKEN") {
                core.setSecret(value);
              }

              core.exportVariable(name, value);
            }

      - name: Check formatting, lint, dependencies, and tests
        env:
          BUILDX_CACHE_ARGS: >-
            --cache-from=type=gha,version=2,scope=lmao-dev
            --cache-to=type=gha,version=2,scope=lmao-dev,mode=max
        run: make ci-quality

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/
          retention-days: 14
          if-no-files-found: ignore

  docker-build:
    name: Build, Scan & Smoke-test Image
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Expose GitHub cache runtime
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const names = [
              "ACTIONS_RUNTIME_TOKEN",
              "ACTIONS_RESULTS_URL",
            ];

            for (const name of names) {
              const value = process.env[name];

              if (!value) {
                throw new Error(`Missing GitHub cache variable: ${name}`);
              }

              if (name === "ACTIONS_RUNTIME_TOKEN") {
                core.setSecret(value);
              }

              core.exportVariable(name, value);
            }

      - name: Set Trivy cache date
        id: cache-date
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Cache Trivy data
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/trivy-cache
          key: trivy-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-date.outputs.day }}
          restore-keys: |
            trivy-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Validate, build, smoke-test, and scan
        env:
          TRIVY_CACHE_DIR: ${{ runner.temp }}/trivy-cache
          BUILDX_CACHE_ARGS: >-
            --cache-from=type=gha,version=2,scope=lmao-production
            --cache-to=type=gha,version=2,scope=lmao-production,mode=max,ignore-error=true
        run: make ci-image