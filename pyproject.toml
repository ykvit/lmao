[project]
name = "lmao"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "Flask==3.1.3",
    "Werkzeug==3.1.8",
    "python-dotenv==1.2.3",
    "requests==2.34.2",
    "gunicorn==25.3.0",
]

[dependency-groups]
dev = [
    "ruff==0.15.12",
    "pytest==9.0.3",
    "pytest-cov==7.1.0",
    "pip-audit==2.10.0",
]

[tool.uv]
# This repository is an application; do not install it as a package.
package = false

[tool.ruff]
# Set the maximum line length to 88 (matching Black's default)
line-length = 88
# Target Python version matching the Dockerfile (Python 3.14)
target-version = "py314"

[tool.ruff.lint]
# E, W - pycodestyle; F - Pyflakes; I - isort
select = ["E", "F", "W", "I"]
# The formatter handles line length
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --cov=core --cov=app --cov-report=term-missing"
testpaths = [
    "tests",
]
pythonpath = [
    ".",
]

[tool.coverage.run]
source = ["core", "."]
omit = [
    "tests/*",
    "*/__init__.py",
]

[tool.coverage.report]
show_missing = true
fail_under = 0
skip_covered = false