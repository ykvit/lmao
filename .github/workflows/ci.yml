name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI_PLATFORM: linux/amd64
  CI_DEV_IMAGE: lmao:dev-ci-${{ github.sha }}
  CI_IMAGE: lmao:ci-${{ github.sha }}

jobs:
  lint-workflows:
    name: Lint Workflows & CI Scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check workflows and CI scripts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make ci-workflows WORKFLOW_LINT_MODE=online

  lint-and-test:
    name: Lint, Audit & Test
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Expose GitHub cache runtime
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const names = [
              "ACTIONS_RUNTIME_TOKEN",
              "ACTIONS_RESULTS_URL",
            ];

            for (const name of names) {
              const value = process.env[name];

              if (!value) {
                throw new Error(`Missing GitHub cache variable: ${name}`);
              }

              if (name === "ACTIONS_RUNTIME_TOKEN") {
                core.setSecret(value);
              }

              core.exportVariable(name, value);
            }

      - name: Check formatting, lint, dependencies, and tests
        env:
          BUILDX_CACHE_ARGS: >-
            --cache-from=type=gha,version=2,scope=lmao-dev
            --cache-to=type=gha,version=2,scope=lmao-dev,mode=max
        run: make ci-quality

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/
          retention-days: 14
          if-no-files-found: ignore

  docker-build:
    name: Build, Scan & Smoke-test Image
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Expose GitHub cache runtime
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const names = [
              "ACTIONS_RUNTIME_TOKEN",
              "ACTIONS_RESULTS_URL",
            ];

            for (const name of names) {
              const value = process.env[name];

              if (!value) {
                throw new Error(`Missing GitHub cache variable: ${name}`);
              }

              if (name === "ACTIONS_RUNTIME_TOKEN") {
                core.setSecret(value);
              }

              core.exportVariable(name, value);
            }

      - name: Set Trivy cache date
        id: cache-date
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Cache Trivy data
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/trivy-cache
          key: trivy-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-date.outputs.day }}
          restore-keys: |
            trivy-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Validate, build, smoke-test, and scan
        env:
          TRIVY_CACHE_DIR: ${{ runner.temp }}/trivy-cache
          BUILDX_CACHE_ARGS: >-
            --cache-from=type=gha,version=2,scope=lmao-production
            --cache-to=type=gha,version=2,scope=lmao-production,mode=max,ignore-error=true
        run: make ci-image