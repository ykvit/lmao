name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      skip-image:
        description: Skip the image build and scan; the caller builds and verifies it.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI_DEV_IMAGE: lmao:dev-ci-${{ github.sha }}
  CI_IMAGE: lmao:ci-${{ github.sha }}

jobs:
  check-workflows:
    name: Check workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: make check-workflows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make check-workflows

  check-code:
    name: Check code
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker
        uses: ./.github/actions/setup-docker

      - name: make check-code
        run: make check-code

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/
          retention-days: 14
          if-no-files-found: ignore

  check-image:
    name: Check image
    # inputs is empty outside workflow_call, so this is true on PRs.
    if: ${{ !inputs.skip-image }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker
        uses: ./.github/actions/setup-docker

      - name: Set Trivy cache date
        id: cache-date
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Cache Trivy data
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/trivy-cache
          key: trivy-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-date.outputs.day }}
          restore-keys: |
            trivy-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: make check-image
        env:
          TRIVY_CACHE_DIR: ${{ runner.temp }}/trivy-cache
        run: make check-image