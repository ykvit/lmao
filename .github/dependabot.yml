version: 2

multi-ecosystem-groups:
  runtime:
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"

  ci-tooling:
    schedule:
      interval: "monthly"
      time: "09:00"
      timezone: "UTC"
    commit-message:
      prefix: "chore(ci)"
    labels:
      - "dependencies"
      - "ci-tools"

updates:
  # Python packages (runtime and dev tools).
  - package-ecosystem: "uv"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "runtime"
    cooldown:
      default-days: 7

  # Runtime images: ./Dockerfile (python, uv).
  - package-ecosystem: "docker"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "runtime"
    cooldown:
      default-days: 7
    # Python minor/major upgrades are done by hand (see below).
    ignore:
      - dependency-name: "python"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"

  # Compose services: the Ollama image in compose.yaml.
  - package-ecosystem: "docker-compose"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "runtime"
    cooldown:
      default-days: 7

  # GitHub Actions: workflows and composite actions.
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    patterns: ["*"]
    multi-ecosystem-group: "ci-tooling"
    cooldown:
      default-days: 7

  # CI tool images: docker/tools.Dockerfile.
  - package-ecosystem: "docker"
    directory: "/docker"
    patterns: ["*"]
    multi-ecosystem-group: "ci-tooling"
    cooldown:
      default-days: 7